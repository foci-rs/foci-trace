[project]
name = "foci-trace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyusb>=1.2"]

[project.scripts]
foci-trace = "foci_trace.cli:main"
foci-trace-analyze = "foci_trace.analyze:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
